    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>

    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol>

    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8zM7 7h.01"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>

<header class="top">
  <div class="top-in">
    <a class="brand" href="index.html" aria-label="Educando para o Futuro – página inicial">
      <svg viewBox="0 0 56 48" aria-hidden="true">
        <circle cx="28" cy="13" r="10" fill="#d9a032"/><circle cx="28" cy="13" r="10" fill="none" stroke="#12285a" stroke-width="2"/>
        <path d="M2 30c10-1 18 1 26 7 8-6 16-8 26-7v12c-10-1-18 1-26 6-8-5-16-7-26-6z" fill="#12285a"/>
        <path d="M28 37v11" stroke="#fff" stroke-width="1.5"/>
        <circle cx="10" cy="22" r="3.5" fill="#12285a"/><circle cx="46" cy="22" r="3.5" fill="#12285a"/>
      </svg>
      <span><b>Educando</b><i>para o Futuro</i></span>
    </a>
    <nav aria-label="Principal">
      <ul class="nav">
        <li><a href="index.html"><svg class="ico"><use href="#i-home"/></svg><span class="lbl">Home</span></a></li>
        <li><a href="cadastro.html" aria-current="page"><svg class="ico"><use href="#i-cal"/></svg><span class="lbl">Cadastro</span></a></li>

    <button class="avatar" type="button" aria-label="Alternar tema claro/escuro" id="tema"><svg class="ico"><use href="#i-user"/></svg></button>

</header>

<main id="conteudo" tabindex="-1">
<section class="hero" aria-labelledby="t-cad">
      <div class="hero-ico" aria-hidden="true"><svg class="ico"><use href="#i-cal"/></svg></div>
      <div><h1 id="t-cad">Cadastrar atendimento</h1><p>Preencha os dados abaixo. Campos com <span class="req" aria-hidden="true">*</span> são obrigatórios.</p></div>
    </section>
    <div class="cad">
      <form class="card form-card" id="form" novalidate aria-describedby="msgs">
        <div class="grid2">
          <div class="field"><label for="c-data">Data <span class="req" aria-hidden="true">*</span></label><div class="inp"><svg class="ico"><use href="#i-cal"/></svg><input type="date" id="c-data" required aria-required="true"></div></div>
          <div class="field"><label for="c-hora">Horário <span class="req" aria-hidden="true">*</span></label><div class="inp"><svg class="ico"><use href="#i-clock"/></svg><input type="time" id="c-hora" required aria-required="true"></div></div>
          <div class="field full"><label for="c-pac">Nome ou código do paciente <span class="req" aria-hidden="true">*</span></label><div class="inp"><svg class="ico"><use href="#i-user"/></svg><input id="c-pac" placeholder="Ex.: PAC-014" maxlength="60" autocomplete="off" required aria-required="true"></div></div>
          <div class="field"><label for="c-prof">Profissional responsável <span class="req" aria-hidden="true">*</span></label><div class="inp"><svg class="ico"><use href="#i-brief"/></svg><select id="c-prof" required aria-required="true"><option value="">Selecione…</option><option>Profissional A</option><option>Profissional B</option><option>Profissional C</option></select></div></div>
          <div class="field"><label for="c-tipo">Tipo de atendimento <span class="req" aria-hidden="true">*</span></label><div class="inp"><svg class="ico"><use href="#i-tag"/></svg><select id="c-tipo" required aria-required="true"><option value="">Selecione…</option><option>Terapia ocupacional</option><option>Psicopedagogia</option><option>Fonoaudiologia</option><option>Psicologia</option></select></div></div>
          <div class="field"><label for="c-status">Status</label><div class="inp"><svg class="ico"><use href="#i-pulse"/></svg><select id="c-status"><option value="agendado" selected>Agendado</option><option value="realizado">Realizado</option><option value="cancelado">Cancelado</option></select></div></div>
          <div class="field full"><label for="c-obs">Observações (opcional)</label><textarea id="c-obs" rows="3" maxlength="300" placeholder="Informações adicionais sobre o atendimento…"></textarea></div>
        </div>
        <div class="cta" style="margin-top:1.25rem">
          <button class="btn btn-gold" type="submit"><svg class="ico"><use href="#i-check"/></svg>Salvar atendimento</button>
          <button class="btn" type="reset"><svg class="ico"><use href="#i-trash"/></svg>Limpar</button>
        </div>
      </form>
      <aside class="panel" aria-labelledby="t-msg">
        <h2 id="t-msg"><span class="step-ico" style="width:40px;height:40px;font-weight:800" aria-hidden="true">i</span>Mensagens de validação</h2>
        <div class="note note-warn"><ul id="msgs" aria-live="polite"></ul></div>
        <div id="ok" role="status"></div>
      </aside>
    </div>
</main>

</html>
