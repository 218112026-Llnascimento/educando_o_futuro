services:
  db:
    image: mysql:8.4
    container_name: educando_futuro_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: educando_futuro
      MYSQL_USER: educando
      MYSQL_PASSWORD: educando123
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
      network: host
    container_name: educando_futuro_app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: educando
      DB_PASSWORD: educando123
      DB_NAME: educando_futuro
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
